groups:
  - name: resource_saturation
    rules:
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 524288000
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High memory usage in the auction API"
          description: "Node.js process memory usage exceeds 500 MiB for more than 2 minutes."

      - alert: MemoryGrowthForecast
        expr: predict_linear(process_resident_memory_bytes[5m], 1800) > 524288000
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Memory usage forecast for the auction API"
          description: "Node.js memory is predicted to exceed 500 MiB within 30 minutes."

      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_seconds > 0.2
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High event loop lag in the auction API"
          description: "Event loop lag exceeds 200 ms for more than 2 minutes."
      
       