
groups:
  - name: application_availability
    rules:
      # 1. Service exists but Prometheus cannot scrape it
      - alert: ServiceDown
        expr: up{job="lab-app-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: web-ops
        annotations:
          summary: "Instance {{ $labels.instance }} of {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} (job {{ $labels.job }}) has been unreachable for more than 1 minute."

      # 2. Service target has disappeared from service discovery
      - alert: ServiceMissing
        expr: absent(up{job="lab-app-service"})
        for: 2m
        labels:
          severity: critical
          team: web-ops
        annotations:
          summary: "No 'lab-app-service' target is being scraped at all"
          description: 'The metric up{job="lab-app-service"} does not exist. The service was removed from discovery or the job is misconfigured.'
      - alert: EmailTest
        expr: vector(1)
        for: 0m
        labels:
          severity: critical
          team: email-test
        annotations:
          summary: "Test email Alertmanager"
          description: "Verification de l'envoi SMTP vers Gmail."